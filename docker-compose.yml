x-ollama-env: &ollama-env
  LLM_PROVIDER: ollama
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}

services:
  ollama:
    image: ollama/ollama:0.40.1
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:0.40.1
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:1.5b}"]
    restart: "no"

  app:
    build:
      context: .
      target: app
    ports:
      - "8000:8000"
    environment:
      <<: *ollama-env
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      LLM_PROVIDER: fake
    volumes:
      - ./reports:/work/reports

  evals:
    profiles: ["eval"]
    build:
      context: .
      target: app
    environment:
      <<: *ollama-env
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    command: ["python", "-m", "evals.runner", "--provider", "ollama", "--repeats", "3"]
    volumes:
      - ./evals/reports:/work/evals/reports

volumes:
  ollama-data:
